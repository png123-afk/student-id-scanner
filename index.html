<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Student ID Scanner</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin: 0;
      padding: 25px 15px;
      min-height: 100vh;

      background:
        radial-gradient(circle at top, #164e3b 0%, #0b2e25 45%, #061c17 100%);

      color: #ecfdf5;
    }

    .container {
      max-width: 420px;
      margin: auto;
    }

    .header {
      margin-bottom: 25px;
    }

    .icon {
      font-size: 45px;
      margin-bottom: 8px;
    }

    h1 {
      margin: 0;
      font-size: 28px;
      color: #a7f3d0;
    }

    .subtitle {
      margin-top: 8px;
      color: #9ccbb9;
      font-size: 15px;
    }

    .scanner-card {
      background: rgba(6, 30, 24, 0.85);
      border: 1px solid rgba(110, 231, 183, 0.25);
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.35);
    }

    #reader {
      width: 100%;
      max-width: 320px;
      margin: auto;
      overflow: hidden;
      border-radius: 15px;
    }

    #result {
      margin-top: 20px;
      font-size: 18px;
      line-height: 1.5;
      color: #d1fae5;
    }

    #doneButton {
      display: none;
      width: 100%;
      margin: 20px auto 5px;
      padding: 14px 20px;

      font-size: 17px;
      font-weight: bold;

      border: 1px solid #6ee7b7;
      border-radius: 12px;

      background: #064e3b;
      color: #d1fae5;

      cursor: pointer;
      transition: 0.2s;
    }

    #doneButton:hover {
      background: #047857;
    }

    .footer {
      margin-top: 25px;
      font-size: 12px;
      color: #6f9f8f;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="header">

      <div class="icon">📱</div>

      <h1>Student ID Scanner</h1>

      <div class="subtitle">
        Scan the student's QR code to record their ID.
      </div>

    </div>


    <div class="scanner-card">

      <div id="reader"></div>

      <div id="result">
        📷 Ready to scan...
      </div>

      <button id="doneButton" onclick="startNextScan()">
        ✅ Done — Scan Next Student
      </button>

    </div>


    <div class="footer">
      Student Identification System
    </div>

  </div>


  <script>

    // Google Apps Script Web App URL
    var scriptURL = "https://script.google.com/macros/s/AKfycbzpI8f3TF4QF4Bs3MitFjBBeE1u6csckL06684V9QkY4qOKXWjDmyVp102xsZwqN5vY/exec";

    var scanner;
    var hasScanned = false;
    var lastScannedID = "";
    var lastScanTime = 0;


    function onScanSuccess(decodedText) {

      // Prevent repeated detections
      if (hasScanned) {
        return;
      }


      // Prevent the same ID from being scanned again too quickly
      var currentTime = Date.now();

      if (
        decodedText === lastScannedID &&
        currentTime - lastScanTime < 3000
      ) {
        return;
      }


      hasScanned = true;
      lastScannedID = decodedText;
      lastScanTime = currentTime;


      // Stop scanner
      scanner.clear();


      document.getElementById("result").innerHTML =
        "🆔 Student ID detected:<br><br>" +
        "<b>" + decodedText + "</b><br><br>" +
        "Recording...";


      // Send Student ID to Google Apps Script
      fetch(
        scriptURL + "?id=" + encodeURIComponent(decodedText),
        {
          mode: "no-cors"
        }
      )

      .then(() => {

        document.getElementById("result").innerHTML =
          "✅ <b>Scan Recorded!</b><br><br>" +
          "Student ID:<br>" +
          "<b>" + decodedText + "</b><br><br>" +
          "Ready for the next student.";

        document.getElementById("doneButton").style.display =
          "block";

      })

      .catch(error => {

        document.getElementById("result").innerHTML =
          "✅ <b>Scan Sent!</b><br><br>" +
          "Student ID:<br>" +
          "<b>" + decodedText + "</b>";

        document.getElementById("doneButton").style.display =
          "block";

      });

    }


    function onScanFailure(error) {
      // Keep scanning
    }


    function startScanner() {

      hasScanned = false;

      document.getElementById("result").innerHTML =
        "📷 Ready to scan...";

      document.getElementById("doneButton").style.display =
        "none";


      scanner = new Html5QrcodeScanner(
        "reader",
        {
          fps: 10,
          qrbox: 250
        },
        false
      );


      scanner.render(
        onScanSuccess,
        onScanFailure
      );

    }


    function startNextScan() {

      document.getElementById("result").innerHTML =
        "⏳ Please wait 3 seconds...";


      setTimeout(function() {
        startScanner();
      }, 3000);

    }


    // Start scanner when page opens
    startScanner();

  </script>

</body>
</html>
